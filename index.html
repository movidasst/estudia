<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Comunidad de Estudio y Actualización Profesional" />
    <meta property="og:description" content="¡Estudia con La Movida de SST!" />
    <meta property="og:image" content="https://assets.poap.xyz/cec12a20-fefb-4199-9cc0-b1ece87fe44d.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://estudia.movidasst.com" />
    
    <title>La Movida de SST</title>
    <meta name="description" content="Plataforma de estudio automatizada La Movida SST.">
    
    <!-- DEPENDENCIAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- GOOGLE FONTS: OUTFIT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            teal: '#007b85',
                            navy: '#00205b',
                            green: '#70ad47',
                            yellow: '#ffb600'
                        },
                        slate: { 
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 500: '#64748b', 600: '#475569', 800: '#1e293b', 900: '#0f172a' 
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 4px 20px -2px rgba(0, 0, 0, 0.03)',
                        'glass-hover': '0 8px 24px -4px rgba(0, 123, 133, 0.12)',
                        'glow-teal': '0 0 15px rgba(0, 123, 133, 0.3)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-8px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.05' },
                            '50%': { opacity: '0.1' },
                        }
                    },
                    borderRadius: {
                        '3xl': '1.5rem',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { 
            background-color: #f8fafc; 
            color: #475569;
            min-height: 100vh; 
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #007b85; }
        
        .bg-tech-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 32, 91, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 32, 91, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            pointer-events: none;
        }
        .glow-teal { background-color: #007b85; width: 40vw; height: 40vw; top: -10%; right: -10%; }
        .glow-yellow { background-color: #ffb600; width: 30vw; height: 30vw; bottom: 10%; left: -5%; }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px -4px rgba(0, 123, 133, 0.12);
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00205b, #007b85, #70ad47);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        .glass-card:hover::before { opacity: 1; }

        .mobile-nav {
            transition: transform 0.3s ease-in-out;
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.95);
        }
        .mobile-nav-hidden { transform: translateY(100%); }
        h1, h2, h3, h4, h5, h6 { color: #00205b; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <div class="bg-tech-grid"></div>
    <div class="ambient-glow glow-teal animate-pulse-glow"></div>
    <div class="ambient-glow glow-yellow animate-pulse-glow" style="animation-delay: 3s;"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyb05qrIOt4QSpzN9nw5p1cWlwDh6gdR5IAAJmrPHes5ArP9a5DUk_dInJWXgLVP-P7Pw/exec"; 
        
        // Claves de Caché
        const CACHE_KEY = 'sst_data_v12_api_segura'; 
        const CACHE_TIME_KEY = 'sst_data_v12_time';
        const CACHE_DURATION = 30 * 60 * 1000; // 30 Minutos

        const Icons = {
            Archive: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="5" x="2" y="4" rx="2"/><path d="M4 9v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>,
            ShieldCheck: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>,
            Calendar: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            Trophy: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
            Search: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            BookOpen: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
            FileText: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>,
            Target: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>,
            Zap: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
            Download: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            User: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Filter: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>,
            UserPlus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>,
            Bell: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
            XCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>,
            Info: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>,
            Camera: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>,
            Home: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            GraduationCap: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21.42 10.922a2 2 0 0 1-.019 3.837l-8.5 4.304a2 2 0 0 1-1.802 0l-8.5-4.304a2 2 0 0 1-.019-3.837l8.5-4.25a2 2 0 0 1 1.84 0l8.5 4.25ZM14 14.5v3.425a2 2 0 0 1-1.106 1.79l-1 .5a2 2 0 0 1-1.788 0l-1-.5A2 2 0 0 1 8 17.925V14.5"/><path d="M4 11v6"/></svg>
        };

        const App = () => {
            const initialTab = typeof window !== 'undefined' ? (new URLSearchParams(window.location.search).get('vista') || 'agenda') : 'agenda';
            
            const [activeTab, setActiveTab] = useState(initialTab); 
            const [searchTerm, setSearchTerm] = useState('');
            const [activeTag, setActiveTag] = useState('');
            const [data, setData] = useState({ sesiones: [], ranking: [] });
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [generatingImage, setGeneratingImage] = useState(false);
            const [selectedRankingId, setSelectedRankingId] = useState('global');
            const [selectedModerator, setSelectedModerator] = useState(null);
            const [showMobileNav, setShowMobileNav] = useState(true);
            const [lastScrollY, setLastScrollY] = useState(0);

            useEffect(() => {
                if (typeof window !== 'undefined') {
                    try {
                        const url = new URL(window.location);
                        if (url.protocol.startsWith('http')) {
                            url.searchParams.set('vista', activeTab);
                            window.history.pushState({}, '', url);
                        }
                    } catch (e) {
                        console.warn("Modificación de URL deshabilitada en entorno de previsualización segura.");
                    }
                }
            }, [activeTab]);

            const fetchSheetData = async () => {
                try {
                    let isCacheValid = false;
                    try {
                        const cachedData = localStorage.getItem(CACHE_KEY);
                        const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
                        const now = new Date().getTime();

                        if (cachedData && cachedTime && (now - Number(cachedTime) < CACHE_DURATION)) {
                            setData(JSON.parse(cachedData));
                            setLoading(false);
                            isCacheValid = true;
                        }
                    } catch (e) { console.warn("Cache no disponible", e); }

                    const response = await fetch(SCRIPT_URL);
                    if (!response.ok) throw new Error("Error en la conexión a la API");
                    const jsonData = await response.json();
                    if (jsonData.error) throw new Error(jsonData.error);
                    
                    setData(jsonData);
                    
                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify(jsonData));
                        localStorage.setItem(CACHE_TIME_KEY, new Date().getTime().toString());
                    } catch (e) { console.warn("No se pudo guardar en cache", e); }
                    
                    if (!isCacheValid) setLoading(false);
                } catch (err) {
                    console.error("Error conectando al backend:", err);
                    if (!data.sesiones || data.sesiones.length === 0) {
                        setError("Error de conexión con la base de datos.");
                        setLoading(false);
                    }
                }
            };

            useEffect(() => { fetchSheetData(); }, []);

            useEffect(() => {
                const controlNavbar = () => {
                    if (typeof window !== 'undefined') {
                        if (window.scrollY > lastScrollY && window.scrollY > 100) setShowMobileNav(false);
                        else setShowMobileNav(true);
                        setLastScrollY(window.scrollY);
                    }
                };
                window.addEventListener('scroll', controlNavbar);
                return () => window.removeEventListener('scroll', controlNavbar);
            }, [lastScrollY]);

            const formatDisplayDate = (dateString) => {
                if (!dateString) return "Fecha por definir";
                try {
                    if (dateString.includes(' de ') && !dateString.includes('GMT')) return dateString;
                    const date = new Date(dateString);
                    if (!isNaN(date.getTime())) {
                        return new Intl.DateTimeFormat('es-VE', { timeZone: 'America/Caracas', day: 'numeric', month: 'long', year: 'numeric' }).format(date);
                    }
                } catch (e) {}
                return dateString;
            };

            const getDriveDirectLink = (url) => {
                if (!url) return null;
                try {
                    if (typeof url !== 'string') return url;
                    if (url.includes('googleusercontent.com')) return url;
                    const patterns = [/\/file\/d\/([a-zA-Z0-9_-]+)/, /id=([a-zA-Z0-9_-]+)/];
                    for (let pattern of patterns) {
                        const match = url.match(pattern);
                        if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
                    }
                } catch (e) {}
                return url;
            };

            const downloadRankingAsImage = async () => {
                const element = document.getElementById('ranking-capture-area');
                if (!element) return;
                setGeneratingImage(true);
                try {
                    await new Promise(resolve => setTimeout(resolve, 500));
                    const canvas = await html2canvas(element, { backgroundColor: '#ffffff', scale: 2, useCORS: true, logging: false });
                    const link = document.createElement('a');
                    link.download = `Ranking_LaMovidaSST_${new Date().toLocaleDateString('es-ES').replace(/\//g, '-')}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error("Error al generar imagen:", err);
                } finally {
                    setGeneratingImage(false);
                }
            };

            const getLevelProgress = (points) => {
                const p = Number(points) || 0;
                if (p < 500) return (p / 500) * 100; 
                if (p < 1000) return ((p - 500) / 500) * 100;
                if (p < 2000) return ((p - 1000) / 1000) * 100;
                if (p < 3000) return ((p - 2000) / 1000) * 100; 
                if (p < 4000) return ((p - 3000) / 1000) * 100; 
                if (p < 5000) return ((p - 4000) / 1000) * 100; 
                return 100; 
            };

            const getNextLevelName = (points) => {
                const p = Number(points) || 0;
                if (p < 500) return "Activo"; 
                if (p < 1000) return "Proactivo"; 
                if (p < 2000) return "Referente"; 
                if (p < 3000) return "Mentor";   
                if (p < 4000) return "Embajador"; 
                return "Leyenda";                 
            };

            const getPointsNeeded = (points) => {
                const p = Number(points) || 0;
                if (p < 500) return 500 - p;
                if (p < 1000) return 1000 - p;
                if (p < 2000) return 2000 - p;
                if (p < 3000) return 3000 - p;
                if (p < 4000) return 4000 - p;
                if (p < 5000) return 5000 - p;
                return 0;
            };

            const getCurrentLevelName = (points) => {
                const p = Number(points) || 0;
                if (p < 500) return "Participante";
                if (p < 1000) return "Activo";
                if (p < 2000) return "Proactivo";
                if (p < 3000) return "Referente";
                if (p < 4000) return "Mentor";
                if (p < 5000) return "Embajador";
                return "Leyenda";
            };

            const filteredSessions = useMemo(() => {
                let sessions = data.sesiones.filter(s => s.tema && String(s.tema).toLowerCase().includes(searchTerm.toLowerCase()));
                if (selectedModerator) {
                    sessions = sessions.filter(s => 
                        (s.moderador1 && String(s.moderador1).includes(selectedModerator)) || 
                        (s.moderador2 && String(s.moderador2).includes(selectedModerator))
                    );
                }
                if (activeTag) {
                    sessions = sessions.filter(s => {
                        const matchTema = s.tema && String(s.tema).toLowerCase().includes(activeTag.toLowerCase());
                        const matchTipo = s.tipo && String(s.tipo).toLowerCase().includes(activeTag.toLowerCase());
                        return matchTema || matchTipo;
                    });
                }
                return sessions;
            }, [data.sesiones, searchTerm, selectedModerator, activeTag]);

            const processedRanking = useMemo(() => {
                if (!data.ranking || !data.ranking.length) return [];
                let sortedList = data.ranking
                    .filter(r => String(r.idSesion) === String(selectedRankingId))
                    .filter(r => (Number(r.puntos) || 0) > 0)
                    .sort((a, b) => b.puntos - a.puntos);
                for (let i = 0; i < sortedList.length; i++) sortedList[i].rank = i + 1;
                return sortedList;
            }, [data.ranking, selectedRankingId]);

            const getTimestamp = (dateStr) => {
                if (!dateStr) return 0;
                const d = new Date(dateStr);
                if (!isNaN(d.getTime())) return d.getTime();
                const meses = { "enero":0, "febrero":1, "marzo":2, "abril":3, "mayo":4, "junio":5, "julio":6, "agosto":7, "septiembre":8, "octubre":9, "noviembre":10, "diciembre":11 };
                const partes = String(dateStr).toLowerCase().split(' de ');
                if (partes.length === 3) return new Date(parseInt(partes[2]), meses[partes[1].trim()], parseInt(partes[0])).getTime();
                return 0;
            };

            const activeSessions = filteredSessions.filter(s => s.estadoAuto !== 'Finalizada' && s.estadoAuto !== 'Concluida');
            const pastSessions = filteredSessions
                .filter(s => s.estadoAuto === 'Finalizada' || s.estadoAuto === 'Concluida')
                .sort((a, b) => getTimestamp(b.fechaInicio) - getTimestamp(a.fechaInicio));

            const Header = () => (
                <header className="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)]">
                    <div className="max-w-6xl mx-auto px-4 md:px-6 py-3 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <img src="https://assets.poap.xyz/cec12a20-fefb-4199-9cc0-b1ece87fe44d.png" alt="Logo" className="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover shadow-sm border border-slate-100 animate-float"/>
                            <div>
                                <h1 className="text-xl md:text-2xl font-extrabold text-brand-navy tracking-tight leading-none flex items-center gap-2">
                                    La Movida <span className="text-brand-teal">SST</span>

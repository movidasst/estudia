name: Verify Estudia social preview
on:
  push:
    paths:
      - '.github/workflows/check-estudia-social-2026.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check WhatsApp Open Graph metadata and public image
        run: |
          set -euo pipefail
          SITE='https://estudia.movidasst.com/'
          IMG='https://estudia.movidasst.com/og-estudia-sst-20261021.jpg'
          for n in $(seq 1 18); do
            if curl -fsSL -A 'WhatsApp/2.26.21.10' --max-time 20 "${SITE}?check_estudia=20261021-${n}" -o /tmp/estudia-page.html && grep -Fq '<meta property="og:image" content="'"${IMG}"'">' /tmp/estudia-page.html; then
              echo "ESTUDIA_OG_META_PASSED_ON_ATTEMPT=${n}"
              break
            fi
            if [ "${n}" -eq 18 ]; then
              echo 'Estudia OG image metadata not deployed' >&2
              exit 1
            fi
            sleep 10
          done
          grep -Fq '<meta property="og:image:width" content="1200">' /tmp/estudia-page.html
          grep -Fq '<meta property="og:image:height" content="630">' /tmp/estudia-page.html
          grep -Fq '<meta name="twitter:card" content="summary_large_image">' /tmp/estudia-page.html
          curl -fsSL -A 'WhatsApp/2.26.21.10' --max-time 25 -D /tmp/headers.txt "${IMG}" -o /tmp/estudia.jpg
          grep -Ei '^HTTP/|^content-type:|^content-length:' /tmp/headers.txt | tail -n 8
          file /tmp/estudia.jpg
          file --mime-type /tmp/estudia.jpg | grep -q 'image/jpeg'
          BYTES=$(wc -c < /tmp/estudia.jpg)
          echo "ESTUDIA_SOCIAL_IMAGE_BYTES=${BYTES}"
          test "${BYTES}" -gt 10000
          test "${BYTES}" -lt 350000
          python - <<'PY'
          from PIL import Image
          image=Image.open('/tmp/estudia.jpg')
          assert image.size == (1200,630), image.size
          print('ESTUDIA_SOCIAL_IMAGE_DIMENSIONS=1200x630')
          PY

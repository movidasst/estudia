name: Install photographic Estudia social image
on:
  push:
    paths:
      - .github/workflows/install-estudia-photoreal-og.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check full size asset and write optimized JPEG
        env:
          SRC_LIST: '["https://media.canva.com/v2/image-resize/format:JPG/height:630/quality:90/uri:ifs%3A%2F%2FM%2Fe13ecb95-ccbe-4877-a533-77007ed1d36f/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAABTsp73PTMbjCBNoKV5PmPyaGOIJwxJQoQsqruGsgaGe&exp=1792629265&osig=AAAAAAAAAAAAAAAAAAAAAPDAOcaOIsk0oCg08Mu_fGYNuGCGUTsAiX9U1D2-Bo2E&signer=media-rpc&token=AAIAAU0AJGUxM2VjYjk1LWNjYmUtNDg3Ny1hNTMzLTc3MDA3ZWQxZDM2ZgAAAAABoWEH0mihP2ylBeIgGl5dh5oNJ61tCawugVV0SsmtczKcACEylg","https://media.canva.com/v2/image-resize/format:JPG/height:630/quality:75/uri:ifs%3A%2F%2FM%2Fe13ecb95-ccbe-4877-a533-77007ed1d36f/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAABTsp73PTMbjCBNoKV5PmPyaGOIJwxJQoQsqruGsgaGe&exp=1792629265&osig=AAAAAAAAAAAAAAAAAAAAAPDAOcaOIsk0oCg08Mu_fGYNuGCGUTsAiX9U1D2-Bo2E&signer=media-rpc&token=AAIAAU0AJGUxM2VjYjk1LWNjYmUtNDg3Ny1hNTMzLTc3MDA3ZWQxZDM2ZgAAAAABoWEH0mihP2ylBeIgGl5dh5oNJ61tCawugVV0SsmtczKcACEylg&x-canva-quality=thumbnail","https://media.canva.com/v2/image-resize/format:JPG/height:105/quality:75/uri:ifs%3A%2F%2FM%2Fe13ecb95-ccbe-4877-a533-77007ed1d36f/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABTsp73PTMbjCBNoKV5PmPyaGOIJwxJQoQsqruGsgaGe&exp=1792629265&osig=AAAAAAAAAAAAAAAAAAAAAPDAOcaOIsk0oCg08Mu_fGYNuGCGUTsAiX9U1D2-Bo2E&signer=media-rpc&token=AAIAAU0AJGUxM2VjYjk1LWNjYmUtNDg3Ny1hNTMzLTc3MDA3ZWQxZDM2ZgAAAAABoWEH0mihP2ylBeIgGl5dh5oNJ61tCawugVV0SsmtczKcACEylg&x-canva-quality=thumbnail"]'
        run: |
          python -m pip install pillow
          python - <<'PY'
          import os,json,urllib.request,io
          from pathlib import Path
          from PIL import Image
          urls=json.loads(os.environ['SRC_LIST'])
          selected=None
          for n,url in enumerate(urls):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  data=urllib.request.urlopen(req,timeout=30).read()
                  im=Image.open(io.BytesIO(data))
                  print('Candidate',n,'size',im.size,'bytes',len(data))
                  if im.size==(1200,630):
                      selected=data
                      break
              except Exception as e:
                  print('Candidate',n,'failed:',str(e)[:250])
          if selected is None:
              raise RuntimeError('Full 1200x630 original could not be fetched; refusing blurry low-resolution replacement')
          Path('og-estudia-sst-20261021-photoreal.jpg').write_bytes(selected)
          print('Saved full resolution image bytes',len(selected))
          PY
      - name: Commit selected image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-estudia-sst-20261021-photoreal.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add new photographic Estudia OG preview image'
          git push

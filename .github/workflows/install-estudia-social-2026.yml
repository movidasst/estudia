name: Install Estudia social preview banner
on:
  push:
    paths:
      - '.github/workflows/install-estudia-social-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check Pillow cairosvg
      - name: Rasterize approved Estudia banner and apply official seal
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps
          import cairosvg
          source=Path('og-estudia-20261021.svg')
          target=Path('og-estudia-sst-20261021.jpg')
          if not source.is_file(): raise RuntimeError('Estudia SVG source is missing')
          png_bytes=cairosvg.svg2png(bytestring=source.read_bytes(), output_width=1200, output_height=630)
          banner=Image.open(BytesIO(png_bytes)).convert('RGBA')
          urls=[
            'https://raw.githubusercontent.com/movidasst/geo/main/logo-oficial-movida-sst-plus.png',
            'https://www.movidasst.com/logo-oficial-movida-sst-plus.png'
          ]
          logo=None
          for url in urls:
            try:
              with urlopen(Request(url,headers={'User-Agent':'MovidaSST-OG-Installer'}),timeout=18) as response:
                logo=Image.open(BytesIO(response.read())).convert('RGBA')
              print('Official logo downloaded from:',url,'resolution',logo.size)
              break
            except Exception as error:
              print('Logo source unavailable:',url,str(error))
          if logo is None: raise RuntimeError('Official seal unavailable, banner not published')
          logo.thumbnail((103,103),Image.Resampling.LANCZOS)
          x=112-logo.width//2
          y=107-logo.height//2
          banner.alpha_composite(logo,(x,y))
          output=banner.convert('RGB')
          for quality in (90,87,85,82,79,76,72,68):
            memory=BytesIO()
            output.save(memory,format='JPEG',quality=quality,subsampling=2,optimize=True,progressive=True)
            if memory.tell() < 340000:
              target.write_bytes(memory.getvalue())
              break
          else: raise RuntimeError('Image larger than WhatsApp-safe size target')
          with Image.open(target) as test:
            test.verify()
          with Image.open(target) as test:
            assert test.size==(1200,630)
          print('ESTUDIA_OG_IMAGE_BYTES=',target.stat().st_size,'quality=',quality,'dimensions=1200x630')
          PY
      - name: Commit banner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og-estudia-sst-20261021.jpg
          if git diff --cached --quiet; then
            echo 'Banner is unchanged'
            exit 0
          fi
          git commit -m 'Install optimized Estudia SST WhatsApp preview image'
          git push
